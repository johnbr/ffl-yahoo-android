name: release-please

on:
  push:
    branches:
      - main

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # A release gets a signed APK attached. Without the signing secrets the step says so and stops:
  # an unsigned APK cannot be installed, and a debug-signed one would block later upgrades.
  apk:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: true
      - name: Build and attach the signed APK
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          KEYSTORE_B64: ${{ secrets.FFL_KEYSTORE_B64 }}
          FFL_KEYSTORE_PASSWORD: ${{ secrets.FFL_KEYSTORE_PASSWORD }}
          FFL_KEY_ALIAS: ${{ secrets.FFL_KEY_ALIAS }}
          FFL_KEY_PASSWORD: ${{ secrets.FFL_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::FFL_KEYSTORE_B64 is not set; no APK attached to $TAG"
            exit 0
          fi
          export FFL_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$FFL_KEYSTORE_PATH"
          ./gradlew --no-daemon --no-configuration-cache :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "ffl-live-$TAG.apk"
          gh release upload "$TAG" "ffl-live-$TAG.apk" --clobber
          rm -f "$FFL_KEYSTORE_PATH"
